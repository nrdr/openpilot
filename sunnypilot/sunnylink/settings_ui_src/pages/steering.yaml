# Page: steering
# Edit this file. Run compile_settings_ui.py to emit settings_ui.json.
id: steering
label: Steering
icon: steering_wheel
order: 1
remote_configurable: true
description: Lateral control, lane changes, and steering behavior
sections:
- id: mads
  title: Modular Assistive Driving System (MADS)
  description: ''
  items:
  - key: Mads
    widget: toggle
    title: Enable Modular Assistive Driving System (MADS)
    description: Enable MADS. Disable toggle to revert back to stock sunnypilot engagement/disengagement.
    enablement:
    - $ref: '#/macros/offroad'
  sub_panels:
  - id: mads_settings
    label: MADS Settings
    trigger_key: Mads
    trigger_condition:
      type: param
      key: Mads
      equals: true
    items:
    - key: MadsMainCruiseAllowed
      widget: toggle
      title: Toggle with Main Cruise
      description: 'Note: For vehicles without LFA/LKAS button, disabling this will prevent lateral control engagement.'
      enablement:
      - $ref: '#/macros/offroad'
      - $ref: '#/macros/mads_full_platforms'
    - key: MadsUnifiedEngagementMode
      widget: toggle
      title: Unified Engagement Mode (UEM)
      description: 'Engage lateral and longitudinal control with cruise control engagement. Note: Once lateral control is
        engaged via UEM, it will remain engaged until it is manually disabled via the MADS button or car shut off.'
      enablement:
      - $ref: '#/macros/offroad'
      - $ref: '#/macros/mads_full_platforms'
    - key: MadsSteeringMode
      widget: multiple_button
      title: Steering Mode on Brake Pedal
      description: Choose how Automatic Lane Centering (ALC) behaves after the brake pedal is manually pressed in sunnypilot.
      options:
      - value: 0
        label: Remain Active
        enablement:
        - $ref: '#/macros/mads_full_platforms'
      - value: 1
        label: Pause
        enablement:
        - $ref: '#/macros/mads_full_platforms'
      - value: 2
        label: Disengage
      enablement:
      - $ref: '#/macros/offroad'
- id: blinker
  title: Blinker Control
  description: Lateral pause behavior during turn signals
  items:
  - key: BlinkerPauseLateralControl
    widget: toggle
    title: Pause Lateral Control with Blinker
    description: Pause lateral control with blinker when traveling below the desired speed selected.
    sub_items:
    - key: BlinkerMinLateralControlSpeed
      widget: option
      title: Minimum Speed to Pause Lateral Control
      min: 0
      max: 255
      step: 5
      unit:
        metric: km/h
        imperial: mph
      enablement:
      - type: param
        key: BlinkerPauseLateralControl
        equals: true
    - key: BlinkerLateralReengageDelay
      widget: option
      title: Post-Blinker Delay
      description: Delay before lateral control resumes after the turn signal ends.
      min: 0
      max: 10
      step: 1
      unit: second
      enablement:
      - type: param
        key: BlinkerPauseLateralControl
        equals: true
- id: lane_change
  title: Lane Change
  description: Automatic lane change timing and behavior
  items:
  - key: AutoLaneChangeTimer
    widget: option
    title: Auto Lane Change by Blinker
    description: |-
      Set a timer to delay the auto lane change operation when the blinker is used. No nudge on the steering wheel is required to auto lane change if a timer is set. Default is Nudge.
    details: |-
      Please use caution when using this feature. Only use the blinker when traffic and road conditions permit.
    options:
    - value: -1
      label: 'Off'
    - value: 0
      label: Nudge
    - value: 1
      label: Nudgeless
    - value: 2
      label: 0.5 second
    - value: 3
      label: 1 second
    - value: 4
      label: 2 seconds
    - value: 5
      label: 3 seconds
  - key: AutoLaneChangeBsmDelay
    widget: toggle
    title: 'Auto Lane Change: Delay with Blind Spot'
    description: Toggle to enable a delay timer for lane changes when blind spot monitoring (BSM) detects a vehicle in your blind
      spot.
    enablement:
    - type: capability
      field: enable_bsm
      equals: true
    - type: param_compare
      key: AutoLaneChangeTimer
      op: '>'
      value: 0
- id: nrdr
  title: nrdr Lateral Tuning
  description: Lateral tuning specific to the nrdr fork.
  items:
  - key: NrdrRemoteTuneScan
    widget: toggle
    title: Run Tune Report Scan
    description: Flip ON to analyze all drive logs on the device. The device flips this back OFF when it starts. A full da
  sub_panels:
  - id: nrdr_car_info
    label: Car & Tune Info
    trigger_key: null
    items:
    - key: NrdrCarTuneInfo
      widget: info
      title: Car & Tune Info
      description: Your car's loaded profile - fingerprint, EPS firmware, gas pedal interceptor and radar status, and the lateral/longitudinal kp/ki/kf. Written by the device once it has fingerprinted the car.
  - id: nrdr_pidf_ground
    label: PID/F Tuning Ground
    trigger_key: null
    items:
    - key: LatPScaleLowSpeed
      widget: option
      title: Low Speed Proportional Scale (Below 25mph)
      description: Scales the proportional (P) term below 25 mph. Higher = more error correction (tighter, can cut corners); lower = looser with wider swings.
      min: 0
      max: 500
      step: 5
      unit: '%'
    - key: LatIScaleLowSpeed
      widget: option
      title: Low Speed Integral Scale (Below 25mph)
      description: Scales the integral (I) term below 25 mph. Builds correction over time to erase steady-state error; too high oscillates.
      min: 0
      max: 500
      step: 5
      unit: '%'
    - key: LatFScaleLowSpeed
      widget: option
      title: Low Speed Feedforward Scale (Below 25mph)
      description: Scales the feedforward (kf) term below 25 mph. Follows the commanded angle rather than error, adding authority without amplifying noise. 100% = tuned value (static).
      min: 0
      max: 500
      step: 5
      unit: '%'
    - key: LatPScaleStandard
      widget: option
      title: Standard Speed Proportional Scale (25-50mph)
      description: Scales the proportional (P) term between 25 and 50 mph.
      min: 0
      max: 500
      step: 5
      unit: '%'
    - key: LatIScaleStandard
      widget: option
      title: Standard Speed Integral Scale (25-50mph)
      description: Scales the integral (I) term between 25 and 50 mph.
      min: 0
      max: 500
      step: 5
      unit: '%'
    - key: LatFScaleStandard
      widget: option
      title: Standard Speed Feedforward Scale (25-50mph)
      description: Scales the feedforward (kf) term between 25 and 50 mph. 100% = tuned value (static).
      min: 0
      max: 500
      step: 5
      unit: '%'
    - key: LatPScaleHighway
      widget: option
      title: Highway Proportional Scale (50mph+)
      description: Scales the proportional (P) term above 50 mph.
      min: 0
      max: 500
      step: 5
      unit: '%'
    - key: LatIScaleHighway
      widget: option
      title: Highway Integral Scale (50mph+)
      description: Scales the integral (I) term above 50 mph.
      min: 0
      max: 500
      step: 5
      unit: '%'
    - key: LatFScaleHighway
      widget: option
      title: Highway Feedforward Scale (50mph+)
      description: Scales the feedforward (kf) term above 50 mph. 100% = tuned value (static).
      min: 0
      max: 500
      step: 5
      unit: '%'
    - key: HondaCenterScale
      widget: option
      title: Center Boost
      description: Extra error correction added while driving straight, as a boost on top of the normal output (0.50 = 50% boost). One static value across all speed ranges. Sometimes the perfect lateral tune is too soft for driving in a straight line.
      min: 0.0
      max: 5.0
      step: 0.01
    - key: HondaCenterBoostThreshold
      widget: option
      title: Center Boost Threshold (deg)
      description: How centered should the steering wheel be when center boost is actually active?
      min: 0.0
      max: 10.0
      step: 0.1
      unit: deg
    - key: HondaCenterBoostMinSpeed
      widget: option
      title: Center Boost Minimum Speed
      description: Below this speed center boost is disabled. Center boost is meant for straight, higher-speed roads; gating it off at low speed stops the wheel from oscillating at stops and in parking-lot crawling.
      min: 0
      max: 80
      step: 1
      unit: mph
  - id: nrdr_unwind
    label: Unwind Helpers
    trigger_key: null
    items:
    - key: HondaUnwindFreeze
      widget: toggle
      title: Unwind Integrator Freeze
      description: Freezes the PID integrator while the steering is returning toward center, so it doesn't hold torque through the unwind.
    - key: HondaUnwindLookahead
      widget: toggle
      title: Unwind Lookahead
      description: Reads the model's planned path to start unwinding earlier, before the instantaneous desired curvature drops.
    - key: HondaUnwindBoostSeconds
      widget: option
      title: Unwind Boost
      description: How long the extra unwind feedforward is held at the start of each unwind before it fades out. Caps the low-speed return assist so it doesn't keep pushing torque through a long unwind. 0 = off.
      min: 0.0
      max: 3.0
      step: 0.1
      unit: s
    - key: HondaUnwindFfMultiplier
      widget: option
      title: Unwind Feedforward Multiplier
      description: Peak feedforward multiplier during an unwind, strongest at a standstill and fading to 1x (no boost) by about 22 mph. Raise for more low-speed return authority if the wheel is lazy coming back to center.
      min: 1.0
      max: 4.0
      step: 0.1
  - id: nrdr_override
    label: Override Tuning
    trigger_key: null
    items:
    - key: NrdrIncreaseOverrideTolerance
      widget: toggle
      title: Increase Driver Override Hysteresis
      description: Reduces the likelihood of false driver override detections (resulting in dropped torque) on sensitive Honda EPS platforms by doubling the override threshold below.
    - key: NrdrDriverOverrideThreshold
      widget: option
      title: Driver Override Threshold
      description: Raw steering torque sensor reading above which you are considered to be steering (driver override). 1200 is Honda's stock threshold; on the few cars with a different stock threshold, your value is applied proportionally so 1200 always means stock.
      min: 100
      max: 5000
      step: 100
    - key: HondaDriverAssistDuringOverride
      widget: toggle
      title: Pass-through assist torque on override
      description: When enabled, openpilot resets the EPS internal state which determines whether it is in lane assist mode or not. As such, enabling this will make the final override feel exactly the same as normal driving (after fade is completed), and when disabled the steering rack may carry on a more resistive feeling.
    - key: HondaOverrideFadeDownSecs
      widget: option
      title: Override Torque Fade Down
      description: Controls how quickly steering torque fades out when driver override begins.
      min: 0.0
      max: 10.0
      step: 0.1
      unit: second
    - key: HondaOverrideFadeUpSecs
      widget: option
      title: Override Torque Fade Up
      description: Controls how quickly steering torque fades back in after driver override ends.
      min: 0.0
      max: 10.0
      step: 0.1
      unit: second
    - key: HondaOverrideTorqueScale
      widget: option
      title: Override Torque Retain
      description: Controls how much openpilot steering torque remains when the override has gone past Override Torque Fade Down.
      min: 0
      max: 100
      step: 1
      unit: '%'
  - id: nrdr_steer_filters
    label: Steer Filters
    trigger_key: null
    items:
    - key: HondaTorqueLowPassFilter
      widget: toggle
      title: Low Pass Filter (tau)
      description: Filter that smooths steering response at the cost of adding lag. Tune to the least amount possible before oscillations begin. Live tests show that going above 0.1 tau rapidly increases the possibility of lag-induced oscillations.
    - key: HondaLpfTauLowSpeed
      widget: option
      title: Low Pass Filter Tau (Below 25mph)
      description: Low-pass filter time constant (seconds) below 25 mph.
      min: 0.0
      max: 5.0
      step: 0.01
      enablement:
      - type: param
        key: HondaTorqueLowPassFilter
        equals: true
    - key: HondaLpfTauStandard
      widget: option
      title: Standard Tau (25-50mph)
      description: Low-pass filter time constant (seconds) between 25 and 50 mph.
      min: 0.0
      max: 5.0
      step: 0.01
      enablement:
      - type: param
        key: HondaTorqueLowPassFilter
        equals: true
    - key: HondaLpfTauHighway
      widget: option
      title: Highway Tau (50mph+)
      description: Low-pass filter time constant (seconds) above 50 mph.
      min: 0.0
      max: 5.0
      step: 0.01
      enablement:
      - type: param
        key: HondaTorqueLowPassFilter
        equals: true
    - key: HondaNotchEnabled
      widget: toggle
      title: Notch Filter
      description: Removes a narrow EPS chatter band (around 7Hz) without the lag a low pass filter adds.
    - key: HondaNotchFreq
      widget: option
      title: Notch Frequency
      description: Frequency (Hz) of the band eliminated from the controller. If you know what Hz your EPS growls at, this can help block that out without adding any extra lag into the controller. Best used in pair with a well-tuned low pass filter.
      min: 1.0
      max: 20.0
      step: 0.1
      enablement:
      - type: param
        key: HondaNotchEnabled
        equals: true
    - key: HondaNotchQ
      widget: option
      title: Notch Q / Width
      description: Tolerance of the removed frequency. Higher = smaller portion removed, lower = wider (nearby frequencies will be removed as well).
      min: 0.1
      max: 10.0
      step: 0.1
      enablement:
      - type: param
        key: HondaNotchEnabled
        equals: true
    - key: HondaSteerDeltaLimiter
      widget: toggle
      title: Legacy Steer Delta Rate Limiter
      description: Limits how quickly requested steering torque can rise or fall. This is an older system of limiting and may no longer prove useful compared to the low pass and notch filters.
    - key: HondaSteerDeltaUp
      widget: option
      title: Steer Delta Up
      description: Controls the maximum upward steering torque rate when the rate limiter is enabled. Too low will add lag.
      min: 0.0
      max: 100.0
      step: 0.1
      enablement:
      - type: param
        key: HondaSteerDeltaLimiter
        equals: true
    - key: HondaSteerDeltaDown
      widget: option
      title: Steer Delta Down
      description: Controls the maximum downward steering torque rate when the rate limiter is enabled. Too low will add lag.
      min: 0.0
      max: 100.0
      step: 0.1
      enablement:
      - type: param
        key: HondaSteerDeltaLimiter
        equals: true
    - key: NrdrMinSteerSpeed
      widget: option
      title: Minimum Steer Speed
      description: Below this speed no steering torque is commanded at all. 0 = steer at any speed (stock). For those who don't want the wheel moving at a standstill or parking-lot speeds.
      min: 0
      max: 45
      step: 1
      unit: mph
  - id: nrdr_ford_lateral
    label: Ford Lateral Tuning
    trigger_key: null
    items:
    - key: NrdrFordOemLateral
      widget: toggle
      title: 'Ford: OEM-Style Lateral'
      description: Ford only. Replaces stock curvature-only steering with Ford's full four-signal command (adds curvature-rate plus a lane-centering path-angle), the way the factory system actually drives. Targets the two stock complaints - the wheel fighting you after you grab it, and running out of steering authority in vigorous turns. OFF = stock curvature-only path, unchanged. BETA - first test on an empty road with hands ready. No effect on non-Ford cars.
    - key: NrdrFordHumanTurn
      widget: toggle
      title: 'Ford: Human Turn Detection'
      description: When you hold the wheel into a turn past 45 degrees, openpilot stops commanding steering so it is not fighting you, then ramps smoothly back in when you let go instead of snapping. This is the fix for the wheel trying to throw you off the road after you touch it. Only active when OEM-Style Lateral is on.
      enablement:
      - type: param
        key: NrdrFordOemLateral
        equals: true
    - key: NrdrFordLanePositioning
      widget: toggle
      title: 'Ford: Lane Positioning'
      description: Drives the path-angle signal with a lane-centering PID for extra steering authority and tighter in-lane position - the main lever against running out of torque. Engages at highway speed and steps aside during auto lane changes. Only active when OEM-Style Lateral is on.
      enablement:
      - type: param
        key: NrdrFordOemLateral
        equals: true
    - key: NrdrFordLanePosGain
      widget: option
      title: 'Ford: Lane Positioning Strength'
      description: How hard the lane-centering path-angle pulls toward lane center. 100 percent is baseline. Raise for stronger centering, lower if it feels busy. Only used when Lane Positioning is on.
      min: 0
      max: 300
      step: 5
      unit: '%'
      enablement:
      - type: param
        key: NrdrFordOemLateral
        equals: true
    - key: NrdrFordMaxLatAccel
      widget: option
      title: 'Ford: Max Lateral Accel'
      description: Raises the lateral-acceleration ceiling that caps how hard the car will corner - the most direct knob for running out of torque. Stock is about 2.4, set low on purpose because the safety model cannot see road banking. Raising it gives more cornering authority but removes that conservative margin; increase in small steps and validate on-road. Only used when OEM-Style Lateral is on.
      min: 2.0
      max: 3.5
      step: 0.05
      unit: m/s2
      enablement:
      - type: param
        key: NrdrFordOemLateral
        equals: true
- id: nrdr_learned
  title: nrdr Learned Params
  description: Live-learned vehicle parameters.
  items: []
  sub_panels:
  - id: nrdr_learned_params
    label: Learned Parameters
    trigger_key: null
    items:
    - key: NrdrLearnSteerRatio
      widget: toggle
      title: Learn Steer Ratio (Auto)
      description: When ON (Auto), uses openpilot's live-learned steer ratio. When OFF, uses the car's static base value. Turn OFF if the learned value drifts and hurts performance.
    - key: NrdrLearnStiffness
      widget: toggle
      title: Learn Tire Stiffness (Auto)
      description: When ON (Auto), uses the live-learned tire stiffness factor. When OFF, uses the static base value of 1.0.
    - key: NrdrLearnAngleOffset
      widget: toggle
      title: Learn Angle Offset (Auto)
      description: When ON (Auto), uses the live-learned steering angle offset. When OFF, uses a static 0.0 offset. Turn OFF if a bad learned offset is pulling the car to one side.
