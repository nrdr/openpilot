# Page: lane_centering
# Edit this file. Run compile_settings_ui.py to emit settings_ui.json.
id: lane_centering
label: Lane Centering
icon: steering_wheel
order: 8
remote_configurable: true
description: Confidence-gated lane centering controls. Settings are writable only while the device is offroad.
sections:
- id: lane_centering
  title: Lane Centering
  description: Bias the model curvature toward the center of two confident lane lines while preserving the normal curvature and jerk limits.
  items:
  - key: LaneCentering
    widget: toggle
    title: Enable Lane Centering
    description: Disabled by default. Enable confidence-gated lane centering for the next drive.
    enablement:
    - $ref: '#/macros/offroad'
    - $ref: '#/macros/not_engaged'
  - key: LaneCenteringPauseOnSignal
    widget: toggle
    title: Pause on Turn Signal
    description: Smoothly release the lane-centering correction while either turn signal is active.
    enablement:
    - $ref: '#/macros/offroad'
    - $ref: '#/macros/not_engaged'
    - type: param
      key: LaneCentering
      equals: true
  - key: LaneCenterOffset
    widget: option
    title: Center Offset
    description: Shift the target left or right of the detected lane center. The controller reduces the offset in a narrow lane.
    min: -0.3
    max: 0.3
    step: 0.01
    unit: meters
    enablement:
    - $ref: '#/macros/offroad'
    - $ref: '#/macros/not_engaged'
    - type: param
      key: LaneCentering
      equals: true
  - key: LaneCenteringE2EAuthority
    widget: option
    title: Model Path Authority
    description: Allow a confident model path to reduce the lane-line correction when the paths disagree. 1.0 gives the model full authority; 0.0 retains the full lane-line correction.
    min: 0.0
    max: 1.0
    step: 0.05
    enablement:
    - $ref: '#/macros/offroad'
    - $ref: '#/macros/not_engaged'
    - type: param
      key: LaneCentering
      equals: true
