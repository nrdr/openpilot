# Page: models
# Edit this file. Run compile_settings_ui.py to emit settings_ui.json.
id: models
label: Models
icon: models
order: 10
remote_configurable: false
description: Driving model behavior and camera calibration
sections:
- id: model_behavior
  title: Model Behavior
  description: Lane desire and lead-vehicle awareness tuning
  items:
  - key: LaneTurnDesire
    widget: toggle
    title: Use Lane Turn Desires
    description: "Uses the turn signal to guide the model's turn direction at low speeds. Off leaves turn selection to the model."
    details: "Applies up to the selected lane-turn speed."
  - key: LaneTurnValue
    widget: option
    title: Adjust Lane Turn Speed
    description: Set the maximum speed for lane turn desires.
    min: 0
    max: 20
    step: 1
    unit:
      metric: km/h
      imperial: mph
    enablement:
    - type: param
      key: LaneTurnDesire
      equals: true
    - $ref: '#/macros/advanced_only'
  - key: LagdToggle
    widget: toggle
    title: Live Learning Steer Delay
    description: "Learns the car's steering response time as you drive. Off uses a fixed delay; PTM Controller uses its own vehicle-specific timing."
  - key: LagdToggleDelay
    widget: option
    title: Adjust Software Delay
    description: "Sets the additional steering prediction delay when live delay learning is off."
    details: "Controllers with vehicle-specific timing ignore this value but preserve it for other controllers."
    min: 0.05
    max: 1.0
    step: 0.01
    enablement:
    - type: not
      condition:
        type: param
        key: LagdToggle
        equals: true
    - $ref: '#/macros/advanced_only'
- id: camera
  title: Camera
  description: Camera position and calibration
  items:
  - key: CameraOffset
    widget: option
    title: Adjust Camera Offset
    description: "Adjusts the model's view of the camera position. Positive values shift its center left; negative values shift it right."
    min: -0.35
    max: 0.35
    step: 0.01
    unit: meters
    enablement:
    - $ref: '#/macros/advanced_only'
