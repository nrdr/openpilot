# Page: steering
# Edit this file. Run compile_settings_ui.py to emit settings_ui.json.
id: steering
label: Steering
icon: steering_wheel
order: 1
remote_configurable: true
description: Lateral control, lane changes, and steering behavior
sections:
- id: mads
  title: Modular Assistive Driving System (MADS)
  description: ''
  items:
  - key: Mads
    widget: toggle
    title: Enable Modular Assistive Driving System (MADS)
    description: "Allows steering assistance to stay active independently of cruise control. Off restores normal combined engagement and disengagement."
    enablement:
    - $ref: '#/macros/offroad'
  sub_panels:
  - id: mads_settings
    label: MADS Settings
    trigger_key: Mads
    trigger_condition:
      type: param
      key: Mads
      equals: true
    items:
    - key: MadsMainCruiseAllowed
      widget: toggle
      title: Toggle with Main Cruise
      description: "Allows the main cruise button to enable steering assistance. Turning this off prevents steering engagement on cars without a separate LFA/LKAS button."
      enablement:
      - $ref: '#/macros/offroad'
      - $ref: '#/macros/mads_full_platforms'
    - key: MadsUnifiedEngagementMode
      widget: toggle
      title: Unified Engagement Mode (UEM)
      description: "Engages steering assistance together with cruise control. Steering remains active until you turn MADS off or shut down the car."
      details: "Turning this setting off restores separate steering and cruise engagement."
      enablement:
      - $ref: '#/macros/offroad'
      - $ref: '#/macros/mads_full_platforms'
    - key: MadsSteeringMode
      widget: multiple_button
      title: Steering Mode on Brake Pedal
      description: "Choose whether steering assistance continues or pauses when you press the brake pedal."
      options:
      - value: 0
        label: Remain Active
        enablement:
        - $ref: '#/macros/mads_full_platforms'
      - value: 1
        label: Pause
        enablement:
        - $ref: '#/macros/mads_full_platforms'
      - value: 2
        label: Disengage
      enablement:
      - $ref: '#/macros/offroad'
- id: blinker
  title: Blinker Control
  description: Lateral pause behavior during turn signals
  items:
  - key: BlinkerPauseLateralControl
    widget: toggle
    title: Pause Lateral Control with Blinker
    description: "Pauses steering assistance when the turn signal is on below the selected speed. Off keeps steering assistance active."
    sub_items:
    - key: BlinkerMinLateralControlSpeed
      widget: option
      title: Minimum Speed to Pause Lateral Control
      min: 0
      max: 255
      step: 5
      unit:
        metric: km/h
        imperial: mph
      enablement:
      - type: param
        key: BlinkerPauseLateralControl
        equals: true
    - key: BlinkerLateralReengageDelay
      widget: option
      title: Post-Blinker Delay
      description: Delay before lateral control resumes after the turn signal ends.
      min: 0
      max: 10
      step: 1
      unit: second
      enablement:
      - type: param
        key: BlinkerPauseLateralControl
        equals: true
- id: torque
  title: Torque Control
  description: Steering torque tuning and lateral control method
  enablement:
  - type: capability
    field: torque_allowed
    equals: true
  items:
  - key: EnforceTorqueControl
    widget: toggle
    title: Enforce Torque Lateral Control
    description: "Uses torque-based steering control instead of the vehicle's default controller. Off restores the default controller."
    visibility:
    - type: not
      condition:
        type: capability
        field: steer_control_type
        equals: angle
    enablement:
    - $ref: '#/macros/offroad'
    - type: capability
      field: torque_allowed
      equals: true
  sub_panels:
  - id: torque_settings
    label: Torque Settings
    trigger_key: EnforceTorqueControl
    trigger_condition:
      type: param
      key: EnforceTorqueControl
      equals: true
    items:
    - key: LateralJerkTorqueController
      widget: toggle
      title: Lateral Jerk Torque Controller
      description: "Anticipates changes in steering to reduce abrupt corrections through turns. Works with Self-Tune and custom tuning."
      visibility:
      - type: not
        condition:
          type: capability
          field: steer_control_type
          equals: angle
      enablement:
      - $ref: '#/macros/offroad'
    - key: LiveTorqueParamsToggle
      widget: toggle
      title: Self-Tune
      description: "Learns torque-controller tuning while you drive, including on vehicles that do not use it by default."
      enablement:
      - $ref: '#/macros/offroad'
    - key: LiveTorqueParamsRelaxedToggle
      widget: toggle
      title: Less Restrict Settings for Self-Tune (Beta)
      description: "Allows Self-Tune to learn from a wider range of driving conditions. Off uses the standard learning criteria."
      enablement:
      - $ref: '#/macros/offroad'
      - type: param
        key: LiveTorqueParamsToggle
        equals: true
    - key: CustomTorqueParams
      widget: toggle
      title: Enable Custom Tuning
      description: "Uses your acceleration-factor and friction values instead of the default torque tune. Manual Real-Time Tuning also applies them instead of learned values."
      enablement:
      - $ref: '#/macros/offroad'
    - key: TorqueParamsOverrideEnabled
      widget: toggle
      title: Manual Real-Time Tuning
      description: "Uses your fixed torque-tuning values instead of Self-Tune's learned values. Off allows learned values to be used again."
      enablement:
      - $ref: '#/macros/offroad'
      - type: param
        key: CustomTorqueParams
        equals: true
    - key: TorqueParamsOverrideLatAccelFactor
      widget: option
      title: Lateral Acceleration Factor
      title_param_suffix:
        param: TorqueParamsOverrideEnabled
        values:
          'true': (Real-Time & Offline)
          'false': (Offline Only)
      min: 0.1
      max: 5.0
      step: 0.1
      unit: m/s²
      enablement:
      - type: param
        key: CustomTorqueParams
        equals: true
      - type: any
        conditions:
        - type: param
          key: TorqueParamsOverrideEnabled
          equals: true
        - type: offroad_only
    - key: TorqueParamsOverrideFriction
      widget: option
      title: Friction
      title_param_suffix:
        param: TorqueParamsOverrideEnabled
        values:
          'true': (Real-Time & Offline)
          'false': (Offline Only)
      min: 0.0
      max: 1.0
      step: 0.01
      enablement:
      - type: param
        key: CustomTorqueParams
        equals: true
      - type: any
        conditions:
        - type: param
          key: TorqueParamsOverrideEnabled
          equals: true
        - type: offroad_only
    - key: TorqueControlTune
      widget: multiple_button
      title: Torque Control Tune Version
      description: Select the version of Torque Control Tune to use.
      options:
      - value: ''
        label: Default
      - value: 1.0
        label: v1.0
      - value: 0.0
        label: v0.0
      enablement:
      - $ref: '#/macros/offroad'
- id: lane_change
  title: Lane Change
  description: Automatic lane change timing and behavior
  items:
  - key: AutoLaneChangeTimer
    widget: option
    title: Auto Lane Change by Blinker
    description: "Starts a lane change after the selected delay without a steering nudge; Nudge keeps manual confirmation. Signal only when it is safe to change lanes."
    details: "You remain responsible for checking surrounding traffic before a lane change."
    options:
    - value: -1
      label: 'Off'
    - value: 0
      label: Nudge
    - value: 1
      label: Nudgeless
    - value: 2
      label: 0.5 second
    - value: 3
      label: 1 second
    - value: 4
      label: 2 seconds
    - value: 5
      label: 3 seconds
  - key: RoadEdgeLaneChangeEnabled
    widget: toggle
    title: 'Block Lane Change: Road Edge Detection'
    description: Blocks lane change when the model sees a road edge on the side you signal.
  - key: AutoLaneChangeBsmDelay
    widget: toggle
    title: 'Auto Lane Change: Delay with Blind Spot'
    description: "Adds a lane-change delay when blind-spot monitoring detects another vehicle."
    details: "Off removes this extra delay."
    enablement:
    - type: capability
      field: enable_bsm
      equals: true
    - type: param_compare
      key: AutoLaneChangeTimer
      op: '>'
      value: 0
