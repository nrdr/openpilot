# Page: steering
# Edit this file. Run compile_settings_ui.py to emit settings_ui.json.
id: steering
label: Steering
icon: steering_wheel
order: 1
remote_configurable: true
description: Lateral control, lane changes, and steering behavior
sections:
- id: mads
  title: Modular Assistive Driving System (MADS)
  description: ''
  items:
  - key: Mads
    widget: toggle
    title: Enable Modular Assistive Driving System (MADS)
    description: Enable MADS. Disable toggle to revert back to stock sunnypilot engagement/disengagement.
    enablement:
    - $ref: '#/macros/offroad'
  sub_panels:
  - id: mads_settings
    label: MADS Settings
    trigger_key: Mads
    trigger_condition:
      type: param
      key: Mads
      equals: true
    items:
    - key: MadsMainCruiseAllowed
      widget: toggle
      title: Toggle with Main Cruise
      description: 'Note: For vehicles without LFA/LKAS button, disabling this will prevent lateral control engagement.'
      enablement:
      - $ref: '#/macros/offroad'
      - $ref: '#/macros/mads_full_platforms'
    - key: MadsUnifiedEngagementMode
      widget: toggle
      title: Unified Engagement Mode (UEM)
      description: Engage lateral and longitudinal control together with cruise control engagement.
      details: 'Engage lateral and longitudinal control with cruise control engagement. Note: Once lateral control is engaged via UEM, it will remain engaged until it is manually disabled via the MADS button or car shut off.'
      enablement:
      - $ref: '#/macros/offroad'
      - $ref: '#/macros/mads_full_platforms'
    - key: MadsSteeringMode
      widget: multiple_button
      title: Steering Mode on Brake Pedal
      description: Choose how Automatic Lane Centering (ALC) behaves after the brake pedal is manually pressed in sunnypilot.
      options:
      - value: 0
        label: Remain Active
        enablement:
        - $ref: '#/macros/mads_full_platforms'
      - value: 1
        label: Pause
        enablement:
        - $ref: '#/macros/mads_full_platforms'
      - value: 2
        label: Disengage
      enablement:
      - $ref: '#/macros/offroad'
- id: blinker
  title: Blinker Control
  description: Lateral pause behavior during turn signals
  items:
  - key: BlinkerPauseLateralControl
    widget: toggle
    title: Pause Lateral Control with Blinker
    description: Pause lateral control with blinker when traveling below the desired speed selected.
    sub_items:
    - key: BlinkerMinLateralControlSpeed
      widget: option
      title: Minimum Speed to Pause Lateral Control
      min: 0
      max: 255
      step: 5
      unit:
        metric: km/h
        imperial: mph
      enablement:
      - type: param
        key: BlinkerPauseLateralControl
        equals: true
    - key: BlinkerLateralReengageDelay
      widget: option
      title: Post-Blinker Delay
      description: Delay before lateral control resumes after the turn signal ends.
      min: 0
      max: 10
      step: 1
      unit: second
      enablement:
      - type: param
        key: BlinkerPauseLateralControl
        equals: true
- id: lane_change
  title: Lane Change
  description: Automatic lane change timing and behavior
  items:
  - key: AutoLaneChangeTimer
    widget: option
    title: Auto Lane Change by Blinker
    description: Set a timer to delay the auto lane change when the blinker is used. Default is Nudge.
    details: |-
      Set a timer to delay the auto lane change operation when the blinker is used. No nudge on the steering wheel is required to auto lane change if a timer is set. Default is Nudge. Please use caution when using this feature. Only use the blinker when traffic and road conditions permit.
    options:
    - value: -1
      label: 'Off'
    - value: 0
      label: Nudge
    - value: 1
      label: Nudgeless
    - value: 2
      label: 0.5 second
    - value: 3
      label: 1 second
    - value: 4
      label: 2 seconds
    - value: 5
      label: 3 seconds
  - key: AutoLaneChangeBsmDelay
    widget: toggle
    title: 'Auto Lane Change: Delay with Blind Spot'
    description: Add a delay timer for lane changes when BSM detects a vehicle in your blind spot.
    details: Toggle to enable a delay timer for lane changes when blind spot monitoring (BSM) detects a vehicle in your blind spot.
    enablement:
    - type: capability
      field: enable_bsm
      equals: true
    - type: param_compare
      key: AutoLaneChangeTimer
      op: '>'
      value: 0
- id: nrdr
  title: nrdr Lateral Tuning
  description: Lateral tuning specific to the nrdr fork.
  items:
  - key: NrdrHandcraftedLateralTune
    widget: toggle
    title: Handcrafted Lateral Tuning
    description: Off by default. Enable this to load the Clarity-derived, road-tested PID profile with this vehicle's own steering geometry and lock conflicting controls.
    details: Loads the shared versioned Honda profile with exact firmware-derived steering through 70 degrees, a smooth handoff to dual-BP by 90 degrees, predictive stiction, NNLC disabled for PID-only control, fingerprint-specific steering geometry, controller helpers, steering filters, and fixed live delay. Cars without an exact firmware map safely use their legacy dual-BP curve. Leave this off for manual tuning.
    visibility:
    - {type: capability, field: has_handcrafted_lateral_profile, equals: true}
    enablement:
    - $ref: '#/macros/offroad'
  sub_panels:
  - id: nrdr_vehicle_model_learning
    label: Vehicle Model & Learning
    trigger_key: null
    items:
    - key: NrdrRemoteTuneScan
      widget: toggle
      title: Run Tune Report Scan
      description: Flip ON to scan every drive log into a tune report (the device flips it back OFF on the next start).
    - key: NrdrCarTuneInfo
      widget: info
      title: Loaded Profile
      details: Live vehicle, controller, base-tune, geometry, and tuning-knob details are written here by the device.
    - key: NrdrCarControllerInfo
      widget: info
      title: Controller
    - key: NrdrCarHandcraftedInfo
      widget: info
      title: Handcrafted
    - key: NrdrCarPidLowInfo
      widget: info
      title: PID Low
    - key: NrdrCarPidMidInfo
      widget: info
      title: PID Mid
    - key: NrdrCarPidHighInfo
      widget: info
      title: PID Hwy
    - key: NrdrCarDampingInfo
      widget: info
      title: Damping
    - key: NrdrCarCenterInfo
      widget: info
      title: Center
    - key: NrdrCarNnlcInfo
      widget: info
      title: NNLC
    - key: NrdrCarSteerRatioInfo
      widget: info
      title: Steer Ratio
    - key: NrdrCarLearningInfo
      widget: info
      title: Learning
    - key: NrdrCarHelpersInfo
      widget: info
      title: Helpers
    - key: NrdrLearnSteerRatio
      widget: toggle
      title: Learn Steer Ratio (Auto)
      description: Uses openpilot's learned scalar on normal cars. Supported mapped Hondas use their configured On-Center anchor.
      details: When ON, unmapped cars use openpilot's live-learned steer ratio. Supported Clarity, Civic, Accord, CR-V, and Insight profiles keep their configured On-Center anchor authoritative in both legacy and firmware-derived modes, avoiding double-counting the rack's variable geometry.
      enablement:
      - $ref: '#/macros/handcrafted_lateral_unlocked'
    - key: NrdrLearnStiffness
      widget: toggle
      title: Learn Tire Stiffness (Auto)
      description: When ON (Auto), uses the live-learned tire stiffness factor. When OFF, uses the static base value of 1.0.
      enablement:
      - $ref: '#/macros/handcrafted_lateral_unlocked'
    - key: NrdrLearnAngleOffset
      widget: toggle
      title: Learn Angle Offset (Auto)
      description: When ON (Auto), uses the live-learned steering angle offset; OFF uses a static 0.0 offset.
      details: When ON (Auto), uses the live-learned steering angle offset. When OFF, uses a static 0.0 offset. Turn OFF if a bad learned offset is pulling the car to one side.
      enablement:
      - $ref: '#/macros/handcrafted_lateral_unlocked'
  - id: nrdr_pidf_ground
    label: Controller Tuning Dungeon
    trigger_key: null
    items:
    - key: NrdrStarPilotPid
      widget: toggle
      enablement:
      - $ref: '#/macros/handcrafted_lateral_unlocked'
      title: StarPilot PID Additions
      description: Adds the borrowed StarPilot turn-in / unwind / per-direction output scaling, not built for Honda.
      details: The borrowed turn-in / unwind / per-direction output scaling (the StarPilot half of _pid_output_scale) not built for Honda. Off = clean banded PID/F + rate-damping D, your center boost kept. Turn on to A/B it against the raw base.
    - key: NrdrLegacyDualBpSteerRatio
      widget: toggle
      visibility:
      - type: any
        conditions:
        - {type: capability, field: car_fingerprint, equals: HONDA_CLARITY}
        - {type: capability, field: car_fingerprint, equals: HONDA_CIVIC}
        - {type: capability, field: car_fingerprint, equals: HONDA_CIVIC_BOSCH}
        - {type: capability, field: car_fingerprint, equals: HONDA_CIVIC_BOSCH_DIESEL}
        - {type: capability, field: car_fingerprint, equals: HONDA_ACCORD}
        - {type: capability, field: car_fingerprint, equals: HONDA_CRV_5G}
        - {type: capability, field: car_fingerprint, equals: HONDA_CRV_HYBRID}
        - {type: capability, field: car_fingerprint, equals: HONDA_INSIGHT}
      enablement:
      - $ref: '#/macros/handcrafted_lateral_unlocked'
      - $ref: '#/macros/not_engaged'
      title: Use Legacy Dual-BP Steer Ratio
      description: Keeps the current road-tested two-breakpoint steer-ratio curve. Default ON.
      details: Turn OFF to use the firmware-derived EPS position map when this car and firmware are recognized. Firmware mode preserves that map exactly through 70 degrees, makes a smooth deterministic handoff to this car's dual-BP curve from 70 to 90 degrees, and follows the dual-BP curve above 90 degrees. Unknown firmware, including currently unmapped Accord firmware, automatically falls back to legacy. Clarity runs PID only while firmware mode is active because its NNLC rate path requires a separate firmware transform.
    - key: NrdrSteerRatioCenterClarity
      widget: option
      visibility:
      - {type: capability, field: car_fingerprint, equals: HONDA_CLARITY}
      enablement:
      - $ref: '#/macros/handcrafted_lateral_unlocked'
      - $ref: '#/macros/not_engaged'
      title: On-Center Steer Ratio
      description: Directly sets the Clarity's steer ratio at zero steering-wheel angle. Default 18.50.
      details: This value anchors firmware-derived mode and starts the legacy curve. Firmware mode keeps the extracted map exact through 70 degrees, hands off to this curve by 90 degrees, and then continues toward the Outer Steer Ratio at 250 degrees.
      min: 8.0
      max: 25.0
      step: 0.01
    - key: NrdrSteerRatioOuterClarity
      widget: option
      visibility:
      - {type: capability, field: car_fingerprint, equals: HONDA_CLARITY}
      enablement:
      - $ref: '#/macros/handcrafted_lateral_unlocked'
      - $ref: '#/macros/not_engaged'
      title: Outer Steer Ratio
      description: Directly sets the Clarity's high-angle steer ratio. Default 12.72.
      details: This is the legacy/fallback curve's outer endpoint, reached at 250 degrees and held beyond it. Firmware mode follows this curve above its 70-to-90-degree handoff. It also supplies the starting anchor for the optional 1.5-second lane-change fade.
      min: 8.0
      max: 25.0
      step: 0.01
    - key: NrdrSteerRatioCenterCivic
      widget: option
      visibility:
      - type: any
        conditions:
        - {type: capability, field: car_fingerprint, equals: HONDA_CIVIC}
        - {type: capability, field: car_fingerprint, equals: HONDA_CIVIC_BOSCH}
        - {type: capability, field: car_fingerprint, equals: HONDA_CIVIC_BOSCH_DIESEL}
      enablement:
      - $ref: '#/macros/handcrafted_lateral_unlocked'
      - $ref: '#/macros/not_engaged'
      title: On-Center Steer Ratio
      description: Directly sets the 10th-gen Civic's steer ratio at zero steering-wheel angle. Default 17.24.
      details: This value anchors firmware-derived mode and starts the legacy curve. Firmware mode keeps the extracted map exact through 70 degrees, hands off to this curve by 90 degrees, and then continues toward the Civic's Outer Steer Ratio.
      min: 8.0
      max: 25.0
      step: 0.01
    - key: NrdrSteerRatioOuterCivic
      widget: option
      visibility:
      - type: any
        conditions:
        - {type: capability, field: car_fingerprint, equals: HONDA_CIVIC}
        - {type: capability, field: car_fingerprint, equals: HONDA_CIVIC_BOSCH}
        - {type: capability, field: car_fingerprint, equals: HONDA_CIVIC_BOSCH_DIESEL}
      enablement:
      - $ref: '#/macros/handcrafted_lateral_unlocked'
      - $ref: '#/macros/not_engaged'
      title: Outer Steer Ratio
      description: Directly sets the 10th-gen Civic's high-angle steer ratio. Default 10.93.
      details: This is the legacy/fallback curve's outer endpoint, reached at the Civic's high-angle breakpoint and held beyond it. Firmware mode follows this curve above its 70-to-90-degree handoff. It also supplies the starting anchor for the optional 1.5-second lane-change fade.
      min: 8.0
      max: 25.0
      step: 0.01
    - key: NrdrSteerRatioCenterAccord
      widget: option
      visibility:
      - {type: capability, field: car_fingerprint, equals: HONDA_ACCORD}
      enablement:
      - $ref: '#/macros/handcrafted_lateral_unlocked'
      - $ref: '#/macros/not_engaged'
      title: On-Center Steer Ratio
      description: Directly sets the 10th-gen Accord's steer ratio at zero steering-wheel angle. Default 18.31.
      details: This absolute value is the starting point of the legacy curve and the future firmware-map anchor. Accord firmware currently falls back to legacy mode.
      min: 8.0
      max: 25.0
      step: 0.01
    - key: NrdrSteerRatioOuterAccord
      widget: option
      visibility:
      - {type: capability, field: car_fingerprint, equals: HONDA_ACCORD}
      enablement:
      - $ref: '#/macros/handcrafted_lateral_unlocked'
      - $ref: '#/macros/not_engaged'
      title: Outer Steer Ratio
      description: Directly sets the 10th-gen Accord's high-angle steer ratio. Default 11.82.
      details: This is the legacy/fallback curve's outer endpoint, reached at the Accord's high-angle breakpoint and held beyond it. It also supplies the starting anchor for the optional 1.5-second lane-change fade.
      min: 8.0
      max: 25.0
      step: 0.01
    - key: NrdrSteerRatioCenterCrv5g
      widget: option
      visibility:
      - type: any
        conditions:
        - {type: capability, field: car_fingerprint, equals: HONDA_CRV_5G}
        - {type: capability, field: car_fingerprint, equals: HONDA_CRV_HYBRID}
      enablement:
      - $ref: '#/macros/handcrafted_lateral_unlocked'
      - $ref: '#/macros/not_engaged'
      title: On-Center Steer Ratio
      description: Directly sets the 5th-gen CR-V's steer ratio at zero steering-wheel angle. Default 17.94.
      details: This value anchors firmware-derived mode when exact CR-V firmware is recognized and starts the legacy curve. Firmware mode keeps the extracted map exact through 70 degrees, hands off to this curve by 90 degrees, and then continues toward the CR-V's Outer Steer Ratio.
      min: 8.0
      max: 25.0
      step: 0.01
    - key: NrdrSteerRatioOuterCrv5g
      widget: option
      visibility:
      - type: any
        conditions:
        - {type: capability, field: car_fingerprint, equals: HONDA_CRV_5G}
        - {type: capability, field: car_fingerprint, equals: HONDA_CRV_HYBRID}
      enablement:
      - $ref: '#/macros/handcrafted_lateral_unlocked'
      - $ref: '#/macros/not_engaged'
      title: Outer Steer Ratio
      description: Directly sets the 5th-gen CR-V's high-angle steer ratio. Default 12.30.
      details: This is the legacy/fallback curve's outer endpoint, reached at the CR-V's high-angle breakpoint and held beyond it. Firmware mode follows this curve above its 70-to-90-degree handoff. It also supplies the starting anchor for the optional 1.5-second lane-change fade.
      min: 8.0
      max: 25.0
      step: 0.01
    - key: NrdrSteerRatioCenterInsight
      widget: option
      visibility:
      - {type: capability, field: car_fingerprint, equals: HONDA_INSIGHT}
      enablement:
      - $ref: '#/macros/handcrafted_lateral_unlocked'
      - $ref: '#/macros/not_engaged'
      title: On-Center Steer Ratio
      description: Directly sets the 3rd-gen Insight's steer ratio at zero steering-wheel angle. Default 16.82.
      details: This value anchors firmware-derived mode and starts the legacy curve. Firmware mode keeps the extracted map exact through 70 degrees, hands off to this curve by 90 degrees, and then continues toward the Insight's Outer Steer Ratio.
      min: 8.0
      max: 25.0
      step: 0.01
    - key: NrdrSteerRatioOuterInsight
      widget: option
      visibility:
      - {type: capability, field: car_fingerprint, equals: HONDA_INSIGHT}
      enablement:
      - $ref: '#/macros/handcrafted_lateral_unlocked'
      - $ref: '#/macros/not_engaged'
      title: Outer Steer Ratio
      description: Directly sets the 3rd-gen Insight's high-angle steer ratio. Default 12.58.
      details: This is the legacy/fallback curve's outer endpoint, reached at the Insight's high-angle breakpoint and held beyond it. Firmware mode follows this curve above its 70-to-90-degree handoff. It also supplies the starting anchor for the optional 1.5-second lane-change fade.
      min: 8.0
      max: 25.0
      step: 0.01
    - key: NrdrLaneChangeEndpointSteerRatio
      widget: toggle
      visibility:
      - type: any
        conditions:
        - {type: capability, field: car_fingerprint, equals: HONDA_CLARITY}
        - {type: capability, field: car_fingerprint, equals: HONDA_CIVIC}
        - {type: capability, field: car_fingerprint, equals: HONDA_CIVIC_BOSCH}
        - {type: capability, field: car_fingerprint, equals: HONDA_CIVIC_BOSCH_DIESEL}
        - {type: capability, field: car_fingerprint, equals: HONDA_ACCORD}
        - {type: capability, field: car_fingerprint, equals: HONDA_CRV_5G}
        - {type: capability, field: car_fingerprint, equals: HONDA_CRV_HYBRID}
        - {type: capability, field: car_fingerprint, equals: HONDA_INSIGHT}
      enablement:
      - $ref: '#/macros/handcrafted_lateral_unlocked'
      title: Start Lane Changes at Outer SR
      description: Starts at the Outer Steer Ratio, then fades continuously to the selected normal steer-ratio mode over 1.5 seconds. Default ON.
      details: The fade starts only when the planner enters lane-change-starting, so pre-lane-change waiting does not consume it. Once started, the fade continues through finishing or completion without a ratio jump. This reacts to the planner state, not blinkers alone.
    - key: LatPScaleLowSpeed
      widget: option
      enablement:
      - $ref: '#/macros/handcrafted_lateral_unlocked'
      title: Low Speed Proportional Scale (Below 25mph)
      description: Scales the proportional (P) term below 25 mph.
      details: Scales the proportional (P) term below 25 mph. Higher = more error correction (tighter, can cut corners); lower = looser with wider swings.
      min: 0
      max: 500
      step: 5
      unit: '%'
    - key: LatIScaleLowSpeed
      widget: option
      enablement:
      - $ref: '#/macros/handcrafted_lateral_unlocked'
      title: Low Speed Integral Scale (Below 25mph)
      description: Scales the integral (I) term below 25 mph.
      details: Scales the integral (I) term below 25 mph. Builds correction over time to erase steady-state error; too high oscillates.
      min: 0
      max: 500
      step: 5
      unit: '%'
    - key: LatFScaleLowSpeed
      widget: option
      enablement:
      - $ref: '#/macros/handcrafted_lateral_unlocked'
      title: Low Speed Feedforward Scale (Below 25mph)
      description: Scales the feedforward (kf) term below 25 mph (100% = tuned value).
      details: Scales the feedforward (kf) term below 25 mph. Follows the commanded angle rather than error, adding authority without amplifying noise. 100% = tuned value (static).
      min: 0
      max: 500
      step: 5
      unit: '%'
    - key: LatPScaleStandard
      widget: option
      enablement:
      - $ref: '#/macros/handcrafted_lateral_unlocked'
      title: Standard Speed Proportional Scale (25-50mph)
      description: Scales the proportional (P) term between 25 and 50 mph.
      min: 0
      max: 500
      step: 5
      unit: '%'
    - key: LatIScaleStandard
      widget: option
      enablement:
      - $ref: '#/macros/handcrafted_lateral_unlocked'
      title: Standard Speed Integral Scale (25-50mph)
      description: Scales the integral (I) term between 25 and 50 mph.
      min: 0
      max: 500
      step: 5
      unit: '%'
    - key: LatFScaleStandard
      widget: option
      enablement:
      - $ref: '#/macros/handcrafted_lateral_unlocked'
      title: Standard Speed Feedforward Scale (25-50mph)
      description: Scales the feedforward (kf) term between 25 and 50 mph (100% = tuned value).
      min: 0
      max: 500
      step: 5
      unit: '%'
    - key: LatPScaleHighway
      widget: option
      enablement:
      - $ref: '#/macros/handcrafted_lateral_unlocked'
      title: Highway Proportional Scale (50mph+)
      description: Scales the proportional (P) term above 50 mph.
      min: 0
      max: 500
      step: 5
      unit: '%'
    - key: LatIScaleHighway
      widget: option
      enablement:
      - $ref: '#/macros/handcrafted_lateral_unlocked'
      title: Highway Integral Scale (50mph+)
      description: Scales the integral (I) term above 50 mph.
      min: 0
      max: 500
      step: 5
      unit: '%'
    - key: LatFScaleHighway
      widget: option
      enablement:
      - $ref: '#/macros/handcrafted_lateral_unlocked'
      title: Highway Feedforward Scale (50mph+)
      description: Scales the feedforward (kf) term above 50 mph (100% = tuned value).
      min: 0
      max: 500
      step: 5
      unit: '%'
    - key: NrdrLatRateDamping
      widget: option
      enablement:
      - $ref: '#/macros/handcrafted_lateral_unlocked'
      title: Rate Damping (D) Strength
      description: Adds a damping (D) term opposing wheel speed to flatten low-speed oscillation; 0 = off.
      details: The derivative term openpilot normally can't use. Adds torque opposing how fast the wheel is moving, which damps the low-speed oscillation plain P can't (the wheel is torque-commanded, so P alone rings). Relies on a clean steering-rate signal and a low-lag EPS - which this car has. 0 = off. Raise until the low-speed wobble flattens; too high makes turn-in feel heavy.
      min: 0
      max: 300
      step: 5
      unit: '%'
    - key: NrdrLatRateDampingFadeSpeed
      widget: option
      enablement:
      - $ref: '#/macros/handcrafted_lateral_unlocked'
      title: Rate Damping Fade-Out Speed
      description: Speed at which rate damping tapers to zero (strongest at a standstill).
      details: Speed at which rate damping tapers to zero. Damping is strongest at a standstill and gone by this speed, where tire self-aligning torque resumes damping the steering itself. Keeps the D term out of your highway feel.
      min: 0
      max: 60
      step: 1
      unit: mph
    - key: HondaCenterScale
      widget: option
      enablement:
      - $ref: '#/macros/handcrafted_lateral_unlocked'
      title: Center Boost
      description: Extra proportional (P) error correction near center; 0.50 is a 50% P boost.
      details: Multiplies only the proportional term near center. Integral, feedforward, and damping keep their normal values. Available at every speed above the minimum, including the highway.
      min: 0.0
      max: 5.0
      step: 0.01
    - key: HondaCenterBoostThreshold
      widget: option
      enablement:
      - $ref: '#/macros/handcrafted_lateral_unlocked'
      title: Center Boost Threshold (deg)
      description: How centered should the steering wheel be when center boost is actually active?
      min: 0.0
      max: 10.0
      step: 0.1
      unit: deg
    - key: HondaCenterBoostMinSpeed
      widget: option
      enablement:
      - $ref: '#/macros/handcrafted_lateral_unlocked'
      title: Center Boost Minimum Speed
      description: Below this speed center boost is disabled; there is no upper-speed cutoff.
      details: Below this speed center boost is disabled. Above the short ramp it remains fully available, including on the highway.
      min: 0
      max: 80
      step: 1
      unit: mph
    - key: NrdrLatStiction
      widget: toggle
      enablement:
      - $ref: '#/macros/handcrafted_lateral_unlocked'
      title: Predictive Lateral Stiction
      description: Tapers torque before a stable steering target, then holds it until another correction is needed.
      details: PID remains the normal throw. A predictive capture stage can only reduce torque as the wheel closes on a stable target, then freezes the captured output until error, relative motion, drift, or a decisive corrective torque reversal requires reacquisition. It operates at every speed and immediately bypasses for driver input, lane changes, steering faults, or control limits. Default is OFF.
    - key: NrdrNnlcEnabled
      widget: toggle
      enablement:
      - $ref: '#/macros/handcrafted_lateral_unlocked'
      title: Enable Neural Network Lateral Model (NNLC)
      description: Use PID at lower speeds and during lane changes, then smoothly hand off to the Clarity neural lateral model at higher speeds. Default is OFF.
      details: OFF keeps the exact Clarity interface.py PID tune active everywhere. ON runs the PID/NNLC hybrid; lane changes immediately select PID before their opening torque command. NNLC remains configured but is inactive whenever a recognized Clarity is using the experimental firmware EPS position map.
      sub_items:
      - key: NrdrNnlcActivationSpeed
        widget: option
        title: Activate NNLC Above
        description: Center speed of the smooth 6 mph PID-to-NNLC handoff. Default is 30 mph (PID full through 27 mph, NNLC full from 33 mph).
        min: 0
        max: 100
        step: 1
        unit: mph
        enablement:
        - type: param
          key: NrdrNnlcEnabled
          equals: true
      - key: NrdrNnlcKpGain
        widget: option
        title: NNLC KP Gain Scale
        description: NNLC proportional feedback gain. 100% gives kp = 1.0.
        min: 0
        max: 300
        step: 5
        unit: '%'
        enablement:
        - type: param
          key: NrdrNnlcEnabled
          equals: true
      - key: NrdrNnlcKfGain
        widget: option
        title: NNLC KF Gain Scale
        description: NNLC neural-model feedforward gain. 50% gives kf = 0.5.
        min: 0
        max: 300
        step: 5
        unit: '%'
        enablement:
        - type: param
          key: NrdrNnlcEnabled
          equals: true
      - key: NrdrNnlcKiGain
        widget: option
        title: NNLC KI Gain Scale
        description: NNLC integral feedback gain. 10% gives ki = 0.1.
        min: 0
        max: 300
        step: 5
        unit: '%'
        enablement:
        - type: param
          key: NrdrNnlcEnabled
          equals: true
  - id: nrdr_override
    label: Override Tuning
    trigger_key: null
    items:
    - key: NrdrIncreaseOverrideTolerance
      widget: toggle
      enablement:
      - $ref: '#/macros/handcrafted_lateral_unlocked'
      title: Increase Driver Override Hysteresis
      description: Reduces false driver override detections on sensitive Honda EPS by doubling the override threshold below.
      details: Reduces the likelihood of false driver override detections (resulting in dropped torque) on sensitive Honda EPS platforms by doubling the override threshold below.
    - key: NrdrDriverOverrideThreshold
      widget: option
      enablement:
      - $ref: '#/macros/handcrafted_lateral_unlocked'
      title: Driver Override Threshold
      description: Raw steering torque reading above which you count as steering (override); default 1400.
      details: Raw steering torque sensor reading above which you are considered to be steering (driver override). On cars with a different stock threshold, this value is applied proportionally so 1200 still represents the stock threshold.
      min: 100
      max: 5000
      step: 100
    - key: NrdrOverrideThresholdCenterBoost
      widget: option
      enablement:
      - $ref: '#/macros/handcrafted_lateral_unlocked'
      title: Override Threshold Center Boost
      description: Lower override threshold used within the Center Boost band; set equal to Driver Override Threshold to disable.
      details: When the wheel is within the Center Boost degree band (on a straight), this lower override threshold applies instead of the one above - so you can override easily on straights while curves keep the higher threshold and do not drop torque from a false override. Set equal to Driver Override Threshold to disable.
      min: 100
      max: 5000
      step: 100
    - key: HondaDriverAssistDuringOverride
      widget: toggle
      enablement:
      - $ref: '#/macros/handcrafted_lateral_unlocked'
      title: Pass-through assist torque on override
      description: Resets the EPS lane-assist state so the final override feels like normal driving after fade completes.
      details: When enabled, openpilot resets the EPS internal state which determines whether it is in lane assist mode or not. As such, enabling this will make the final override feel exactly the same as normal driving (after fade is completed), and when disabled the steering rack may carry on a more resistive feeling.
    - key: HondaOverrideFadeDownSecs
      widget: option
      enablement:
      - $ref: '#/macros/handcrafted_lateral_unlocked'
      title: Override Torque Fade Down
      description: Controls how quickly steering torque fades out when driver override begins.
      min: 0.0
      max: 10.0
      step: 0.1
      unit: second
    - key: HondaOverrideFadeUpSecs
      widget: option
      enablement:
      - $ref: '#/macros/handcrafted_lateral_unlocked'
      title: Override Torque Fade Up
      description: Controls how quickly steering torque fades back in after driver override ends.
      min: 0.0
      max: 10.0
      step: 0.1
      unit: second
    - key: HondaOverrideTorqueScale
      widget: option
      enablement:
      - $ref: '#/macros/handcrafted_lateral_unlocked'
      title: Override Torque Retain
      description: Controls how much openpilot steering torque remains when the override has gone past Override Torque Fade Down.
      min: 0
      max: 100
      step: 1
      unit: '%'
  - id: nrdr_steer_filters
    label: Steer Filters
    trigger_key: null
    items:
    - key: HondaTorqueLowPassFilter
      widget: toggle
      enablement:
      - $ref: '#/macros/handcrafted_lateral_unlocked'
      title: Low Pass Filter (tau)
      description: Smooths steering response at the cost of adding lag; tune to the least amount before oscillation.
      details: Filter that smooths steering response at the cost of adding lag. Tune to the least amount possible before oscillations begin. Live tests show that going above 0.1 tau rapidly increases the possibility of lag-induced oscillations.
    - key: HondaLpfTauLowSpeed
      widget: option
      title: Low Pass Filter Tau (Below 25mph)
      description: Low-pass filter time constant (seconds) below 25 mph.
      min: 0.0
      max: 5.0
      step: 0.01
      enablement:
      - $ref: '#/macros/handcrafted_lateral_unlocked'
      - type: param
        key: HondaTorqueLowPassFilter
        equals: true
    - key: HondaLpfTauStandard
      widget: option
      title: Standard Tau (25-50mph)
      description: Low-pass filter time constant (seconds) between 25 and 50 mph.
      min: 0.0
      max: 5.0
      step: 0.01
      enablement:
      - $ref: '#/macros/handcrafted_lateral_unlocked'
      - type: param
        key: HondaTorqueLowPassFilter
        equals: true
    - key: HondaLpfTauHighway
      widget: option
      title: Highway Tau (50mph+)
      description: Low-pass filter time constant (seconds) at or above 50 mph.
      min: 0.0
      max: 5.0
      step: 0.01
      enablement:
      - $ref: '#/macros/handcrafted_lateral_unlocked'
      - type: param
        key: HondaTorqueLowPassFilter
        equals: true
    - key: HondaSteerDeltaLimiter
      widget: toggle
      enablement:
      - $ref: '#/macros/handcrafted_lateral_unlocked'
      title: Legacy Steer Delta Rate Limiter
      description: Limits how quickly requested steering torque can rise or fall.
      details: Limits how quickly requested steering torque can rise or fall. This is an older system of limiting and may no longer prove useful compared to the low pass filter.
    - key: HondaSteerDeltaUp
      widget: option
      title: Steer Delta Up
      description: Maximum upward steering torque rate when the rate limiter is enabled (too low will add lag).
      min: 0.0
      max: 100.0
      step: 0.1
      enablement:
      - $ref: '#/macros/handcrafted_lateral_unlocked'
      - type: param
        key: HondaSteerDeltaLimiter
        equals: true
    - key: HondaSteerDeltaDown
      widget: option
      title: Steer Delta Down
      description: Maximum downward steering torque rate when the rate limiter is enabled (too low will add lag).
      min: 0.0
      max: 100.0
      step: 0.1
      enablement:
      - $ref: '#/macros/handcrafted_lateral_unlocked'
      - type: param
        key: HondaSteerDeltaLimiter
        equals: true
- id: nrdr_special
  title: nrdr Special
  description: Dashboard, diagnostics, and special features.
  items: []
  sub_panels:
  - id: nrdr_party_tricks
    label: Special
    trigger_key: null
    items:
    - key: HondaInjectionTest
      widget: toggle
      title: Injection Test (Caution!)
      description: Multiplies the lateral PID output scale by 999% as a diagnostic stress test. Use with extreme caution.
      details: When enabled, the lateral PID output scale is multiplied by 999%. This is a diagnostic stress test to see how the car reacts to a massive steering command. Use with extreme caution on a safe, empty road.
    - key: HondaAltDashboardSpeed
      widget: multiple_button
      title: Alternative Dashboard Speed Design
      description: Repurposes the cluster's set-speed slot to show lead, GPS, or true cluster speed (needs openpilot longitudinal).
      details: Lead Speed shows the lead's speed in whole mph ("Stopped" below 1 mph, "--" with no lead). GPS Speed shows the comma's own true speed. Cluster Speed shows exactly what the dash cluster reads.
      options:
      - value: 0
        label: Stock
      - value: 1
        label: Lead Speed
      - value: 2
        label: GPS Speed
      - value: 3
        label: Cluster Speed
    - key: HondaAltDashboardDistance
      widget: option
      title: Alternative Dashboard Distance Design
      description: Repurposes the cluster's distance bars / mini car (requires openpilot longitudinal).
      details: Repurposes the cluster's distance bars / mini car (requires openpilot longitudinal). Radar closes the bars in as the lead approaches. Velocity pushes the bars out under acceleration and pulls them in under braking. Non-stock designs stay on the cluster permanently, even when not engaged.
      options:
      - value: 0
        label: Stock
      - value: 1
        label: Radar
      - value: 2
        label: Velocity
    - key: NrdrClearDashFaults
      widget: toggle
      title: Clear Dashboard Fault Codes
      description: Forces the cluster's FCM/icon fault bits off and suppresses the stock FCW chime.
      details: Forces the cluster's FCM/icon fault bits off and suppresses the stock FCW chime. Lets a car with a dead or absent stock camera run a clean dash. Turn OFF for stock openpilot behavior (camera values passed through, FCW chime active).
    - key: HondaSpoofCameraMessages
      widget: toggle
      title: Spoof Camera Messages
      description: Dead camera only - keeps the CAMERA_MESSAGES broadcast alive so the cluster never raises a high-beam fault.
      details: Dead camera only - keeps the camera's CAMERA_MESSAGES broadcast alive so the cluster never raises "Auto High Beam System Problem" (that fault is a message timeout, not a code). Leave OFF if your stock camera works.
    - key: NrdrCruiseButtonSubMode
      widget: toggle
      title: Cruise Button Sub-Mode
      description: Dynamic HUD - the distance or set/resume button first wakes a blinking preview on the cluster.
      details: Dynamic HUD - pressing the distance button or set/resume first wakes a preview on the cluster (current personality on the bars, set speed if engaged, all blinking). Only presses made during the preview actually change the personality or set speed. The blink starts lazy and accelerates continuously until it cuts off.
    - key: NrdrCruiseButtonSubModeSecs
      widget: option
      title: Sub-Mode Visibility Time
      description: How long the preview stays on the cluster after a button press.
      details: How long the preview stays on the cluster after a button press. The blink ramp always spans the whole window, slow at the start and rapid right before it falls off.
      min: 5
      max: 60
      step: 1
      unit: second
      enablement:
      - type: param
        key: NrdrCruiseButtonSubMode
        equals: true
