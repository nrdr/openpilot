# Page: vehicle (per-brand settings)
# Compiles to settings_ui.json#vehicle_settings (brand = section id).
id: vehicle
label: Vehicle
icon: vehicle
order: 99
kind: vehicle
sections:
- id: honda
  title: Honda / Acura Settings
  description: ''
  items:
  - key: HondaEnforceStockLongitudinal
    widget: toggle
    needs_onroad_cycle: true
    title: 'Honda Nidec: Enforce Factory Longitudinal Control'
    description: "Uses factory ACC to control acceleration and braking instead of openpilot. Off allows openpilot cruise control."
    enablement:
    - $ref: '#/macros/not_engaged'
- id: hyundai
  title: Hyundai / Kia / Genesis Settings
  description: ''
  items:
  - key: HyundaiLongitudinalTuning
    widget: multiple_button
    title: Custom Longitudinal Tuning
    options:
    - value: 0
      label: 'Off'
    - value: 1
      label: Dynamic
    - value: 2
      label: Predictive
    visibility:
    - type: capability
      field: hyundai_alpha_long_available
      equals: true
    enablement:
    - $ref: '#/macros/offroad'
    - $ref: '#/macros/longitudinal'
- id: subaru
  title: Subaru Settings
  description: ''
  items:
  - key: SubaruStopAndGo
    widget: toggle
    title: Stop and Go (Beta)
    enablement:
    - $ref: '#/macros/offroad'
    - type: capability
      field: has_stop_and_go
      equals: true
  - key: SubaruStopAndGoManualParkingBrake
    widget: toggle
    title: Stop and Go for Manual Parking Brake (Beta)
    enablement:
    - $ref: '#/macros/offroad'
    - type: capability
      field: has_stop_and_go
      equals: true
- id: tesla
  title: Tesla Settings
  description: ''
  items:
  - key: TeslaCoopSteering
    widget: toggle
    title: Cooperative Steering (Beta)
    enablement:
    - $ref: '#/macros/offroad'
  - key: TeslaMadsScreenButton
    widget: multiple_button
    title: MADS Screen Activation
    description: 'Toggle MADS with a multi-finger press on the infotainment screen; more fingers reduce accidental activation. Off resets MADS settings to their defaults.'
    options:
    - value: 0
      label: 'Off'
    - value: 1
      label: 3-Finger
    - value: 2
      label: 4-Finger
    - value: 3
      label: 5-Finger
    visibility:
    - type: capability
      field: tesla_has_vehicle_bus
      equals: true
    enablement:
    - $ref: '#/macros/offroad'
- id: toyota
  title: Toyota / Lexus Settings
  description: ''
  items:
  - key: ToyotaEnforceStockLongitudinal
    widget: toggle
    needs_onroad_cycle: true
    title: Enforce Factory Longitudinal Control
    description: "Uses factory ACC to control acceleration and braking instead of openpilot. Off allows openpilot cruise control."
    enablement:
    - $ref: '#/macros/not_engaged'
  - key: ToyotaStopAndGoHack
    widget: toggle
    needs_onroad_cycle: true
    title: Stop and Go Hack (Alpha)
    description: "Enables automatic resume in stop-and-go traffic on supported Toyota and Lexus vehicles. Experimental: be ready to take over."
    details: "Off restores the normal resume behavior."
    enablement:
    - $ref: '#/macros/not_engaged'
    - $ref: '#/macros/longitudinal'
    - type: param
      key: ToyotaEnforceStockLongitudinal
      equals: false
